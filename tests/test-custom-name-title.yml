name: Test custom check run name and title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy SpotBugs fixture report (no violations) into workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          cp "$GITHUB_WORKSPACE/tests/fixtures/spotbugsXml-empty.xml" "$GITHUB_WORKSPACE/reports/spotbugsXml-empty.xml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: reports/spotbugsXml-empty.xml
          name: my-custom-spotbugs
          title: My Custom SpotBugs Report
          token: ${{ github.token }}
      - name: Assert action ran with custom name and title (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom name and title"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
